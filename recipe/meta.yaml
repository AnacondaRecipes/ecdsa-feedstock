{% set name = "ecdsa" %}
{% set version = "0.19.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 62635b0ac1ca2e027f82122b5b81cb706edc38cd91c63dda28e4f3455a2bf930

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools
  run:
    - python
    - six >=1.9.0

# E       binascii.Error: Incorrect padding
{% set deselect_tests = " --deselect=src/ecdsa/test_keys.py::test_SigningKey_from_pem_pkcs8v2_EdDSA" %}
test:
  source_files:
    - src/ecdsa
  imports:
    - ecdsa
  commands:
    - pip check
    - pytest -vv src/ecdsa {{ deselect_tests }}
  requires:
    - pip
    - pytest
    - hypothesis

about:
  home: https://github.com/tlsfuzzer/python-ecdsa
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: ECDSA cryptographic signature library (pure python)
  dev_url: https://github.com/tlsfuzzer/python-ecdsa
  doc_url: https://pypi.org/project/ecdsa
  description: |
    This is an easy-to-use implementation of ECC (Elliptic Curve Cryptography)
    with support for ECDSA (Elliptic Curve Digital Signature Algorithm),
    EdDSA (Edwards-curve Digital Signature Algorithm)
    and ECDH (Elliptic Curve Diffie-Hellman),
    implemented purely in Python

extra:
  recipe-maintainers:
    - mariusvniekerk
